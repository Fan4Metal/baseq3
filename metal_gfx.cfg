// Exec after metal.cfg

// Textures and lighting
seta r_picmip "7"
seta r_vertexLight "1"
seta r_dynamicLight "0"
seta r_detailtextures "0"
seta r_fastSky "1"
seta r_primitives "0"

// Brightness
seta r_gamma "1.2"
seta r_ignoreHWGamma "1"
seta r_mapOverBrightBits "1"
seta r_mapOverBrightCap "225"

// Bloom
seta r_enableBloom "0"
seta r_bloomBrightThreshold "0.125"
seta r_bloomIntensity "0.750"
seta r_bloomSaturation "0.271"

// Effects
seta cg_brassTime "0"
seta cg_smoke_SG "0"
seta cg_smokeRadius_GL "0"
seta cg_smokeRadius_RL "0"

seta cg_lightningStyle "5"

vid_restart